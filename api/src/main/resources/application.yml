spring:
  application:
    name: contentplan-api
  datasource:
    # Rol de aplicación (ADR 0003): solo DML, sin ser dueño de nada ni saltarse RLS.
    # Sin valor por defecto para la contraseña: si falta, la app no arranca.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:contentplan}
    username: contentplan_app
    password: ${CONTENTPLAN_APP_PASSWORD}
  flyway:
    locations: classpath:db/migration
    # Flyway abre su propia conexión como dueño del esquema; la API nunca usa este rol.
    # La URL se hereda de spring.datasource.
    user: contentplan_owner
    password: ${CONTENTPLAN_OWNER_PASSWORD}
contentplan:
  seguridad:
    # ID de cliente OAuth de Google (ADR 0004): el token debe llevarlo como audience.
    # No es un secreto, pero sin valor por defecto: si falta, la app no arranca en lugar de
    # aceptar tokens emitidos para otra aplicación.
    google-client-id: ${GOOGLE_CLIENT_ID}
logging:
  structured:
    format:
      # JSON por línea en consola; los campos del MDC (correlationId) salen en el JSON
      console: logstash
