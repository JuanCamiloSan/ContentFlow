services:
  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contentplan}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en infrastructure/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en infrastructure/.env}
      # Contraseñas de los roles que crea postgres/init-roles.sh (ADR 0003)
      CONTENTPLAN_OWNER_PASSWORD: ${CONTENTPLAN_OWNER_PASSWORD:?Define CONTENTPLAN_OWNER_PASSWORD en infrastructure/.env}
      CONTENTPLAN_APP_PASSWORD: ${CONTENTPLAN_APP_PASSWORD:?Define CONTENTPLAN_APP_PASSWORD en infrastructure/.env}
    ports:
      # Solo accesible desde esta máquina
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Solo corre al inicializar un volumen nuevo; con uno existente hay que recrearlo (down -v)
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
